help-screen-r5" x="24.4" textLength="24.4" y="312.8">-h</text><text class="wrap-flask-help-screen-r1" x="48.8" textLength="12.2" y="312.8">,</text><text class="wrap-flask-help-screen-r5" x="73.2" textLength="73.2" y="312.8">--host</text><text class="wrap-flask-help-screen-r4" x="158.6" textLength="48.8" y="312.8">TEXT</text><text class="wrap-flask-help-screen-r1" x="366" textLength="305" y="312.8">The&#160;interface&#160;to&#160;bind&#160;to.</text><text class="wrap-flask-help-screen-r5" x="24.4" textLength="24.4" y="337.2">-p</text><text class="wrap-flask-help-screen-r1" x="48.8" textLength="12.2" y="337.2">,</text><text class="wrap-flask-help-screen-r5" x="73.2" textLength="73.2" y="337.2">--port</text><text class="wrap-flask-help-screen-r4" x="158.6" textLength="85.4" y="337.2">INTEGER</text><text class="wrap-flask-help-screen-r1" x="366" textLength="244" y="337.2">The&#160;port&#160;to&#160;bind&#160;to.</text><text class="wrap-flask-help-screen-r5" x="24.4" textLength="73.2" y="361.6">--cert</text><text class="wrap-flask-help-screen-r4" x="109.8" textLength="48.8" y="361.6">PATH</text><text class="wrap-flask-help-screen-r1" x="366" textLength="488" y="361.6">Specify&#160;a&#160;certificate&#160;file&#160;to&#160;use&#160;HTTPS.</text><text class="wrap-flask-help-screen-r5" x="24.4" textLength="61" y="386">--key</text><text class="wrap-flask-help-screen-r4" x="97.6" textLength="48.8" y="386">FILE</text><text class="wrap-flask-help-screen-r1" x="366" textLength="610" y="386">The&#160;key&#160;file&#160;to&#160;use&#160;when&#160;specifying&#160;a&#160;certificate.</text><text class="wrap-flask-help-screen-r5" x="24.4" textLength="97.6" y="410.4">--reload</text><text class="wrap-flask-help-screen-r1" x="134.2" textLength="12.2" y="410.4">/</text><text class="wrap-flask-help-screen-r5" x="158.6" textLength="134.2" y="410.4">--no-reload</text><text class="wrap-flask-help-screen-r1" x="366" textLength="561.2" y="410.4">Enable&#160;or&#160;disable&#160;the&#160;reload