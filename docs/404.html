<!DOCTYPE html>
<!--
  Served by GitHub Pages for any path under /click-extra/ that the site does not
  publish. Copied verbatim to the root of the build by `html_extra_path` in
  `conf.py`.

  Self-contained on purpose: no theme, no stylesheet, no script. A 404 is
  reached from any depth, so a relative asset path would break on half of them,
  and a page that explains a missing file must not depend on another file. Links
  start from the /click-extra/ root of the project site for the same reason.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found - Click Extra</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  p { margin: 0 0 1.5rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: inline-block; margin: 0 0.75rem; }
</style>
</head>
<body>
<main>
  <h1>This page does not exist</h1>
  <p>
    The link you followed is mistyped, or it points to a page that moved or
    was removed.
  </p>
  <ul>
    <li><a href="/click-extra/">Home</a></li>
    <li><a href="/click-extra/install.html">Installation</a></li>
    <li><a href="/click-extra/search.html">Search</a></li>
  </ul>
</main>
</body>
</html>
